name: refresh-events
on:
  schedule:
    - cron: '0 1 * * *'   # Daily 01:00 UTC (~9am KL)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # continue-on-error matters here. fetch_events.js exits non-zero when a
      # source fails, and Eventbrite reliably fails from Actions (it 405s
      # datacenter IPs). Without this the job would stop before committing and
      # we would throw away the Ticketmelon events it did fetch.
      # Supabase pauses free-tier projects after 7 days with no activity, and a
      # paused project stops resolving in DNS entirely, which takes sign-in and
      # sync down with it. This has happened more than once despite a twice-a-week
      # request, so ping both Auth and the database every day.
      # No secret needed: the anon key is public by design and row security
      # means this read returns nothing.
      - name: keep supabase awake
        continue-on-error: true
        run: |
          ANON=$(node -e "eval(require('fs').readFileSync('supabase-config.js','utf8').replace('window.','global.'));console.log(CF_SB.anon)")
          URL=$(node -e "eval(require('fs').readFileSync('supabase-config.js','utf8').replace('window.','global.'));console.log(CF_SB.url)")
          auth_code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/auth/v1/health" --max-time 30 || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/cf_state?select=id&limit=1" -H "apikey: $ANON" --max-time 30 || true)
          echo "supabase auth ping: HTTP $auth_code"
          echo "supabase database ping: HTTP $code"
          [ "$auth_code" = "200" ] || echo "::warning::Supabase auth ping returned $auth_code, project may be paused"
          [ "$code" = "200" ] || echo "::warning::Supabase database ping returned $code, project may be paused"

      - name: fetch events
        id: fetch
        continue-on-error: true
        run: node fetch_events.js

      - name: commit if changed
        run: |
          git config user.name "cf-events-bot"
          git config user.email "cf-events-bot@users.noreply.github.com"
          git add events.js
          git diff --staged --quiet || (git commit -m "chore: auto-refresh KL events" && git push)

      # Go red on a source failure so it is actually visible. The old workflow
      # reported success while writing an empty feed, and What's On sat blank
      # for a week with a green tick next to it.
      - name: flag source failures
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "A source failed. The feed was preserved, but check the fetch step log."
          exit 1
